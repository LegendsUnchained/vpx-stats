name: Deploy generated stats to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out site
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        if: github.event_name == 'push'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test stats compiler
        if: github.event_name == 'push'
        run: npm test

      - name: Check out generated data
        uses: actions/checkout@v6
        with:
          ref: data
          path: generated-data

      - name: Add generated stats to site
        run: |
          cp generated-data/stats.json site/data/stats.json
          jq -e '.schemaVersion == 2 and (.tables | length) > 0' site/data/stats.json >/dev/null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
