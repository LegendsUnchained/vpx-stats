name: Deploy generated stats to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out site
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        if: github.event_name == 'push'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test stats compiler
        if: github.event_name == 'push'
        run: npm test

      - name: Check out generated data
        uses: actions/checkout@v6
        with:
          ref: data
          path: generated-data

      - name: Add generated stats to site
        run: |
          cp generated-data/stats.json site/data/stats.json
          jq -e '.schemaVersion == 2 and (.tables | length) > 0' site/data/stats.json >/dev/null

      # A totals-only endpoint for callers that want the headline numbers and
      # nothing else — the Table Manager marketing site pulls two of them into
      # its hero, and stats.json is ~220 KB of per-table detail and artwork URLs
      # it would otherwise download on every visit. Derived from the file above
      # rather than generated on Ash, so the two can never disagree and the
      # worker needs no second artifact.
      - name: Derive the totals endpoint
        run: |
          jq '{
            schemaVersion,
            generatedAt,
            tableCount: (.tables | length),
            periods: (.periods | map_values({ label, start, end, totalPlays, activeTables }))
          }' site/data/stats.json > site/data/totals.json
          jq -e '
            .schemaVersion == 2
            and .tableCount > 0
            and ([.periods | keys[]] | sort == ["all", "day", "month", "week", "year"])
            and ([.periods[].totalPlays] | all(type == "number"))
          ' site/data/totals.json >/dev/null

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
